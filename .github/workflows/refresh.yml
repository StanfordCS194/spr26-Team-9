name: Refresh Articles

on:
  schedule:
    - cron: "0 16 * * *"

  workflow_dispatch:
    inputs:
      query:
        description: "News search query"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv lxml

      - name: Run pipeline
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          CURRENT_API: ${{ secrets.CURRENT_API }}
          CURRENT_URL: ${{ secrets.CURRENT_URL }}
        run: python webscraper/refresh.py --query "${{ github.event.inputs.query }}"

      - name: Copy articles to frontend with timestamp
        run: |
          python - <<'EOF'
          import json, sys
          from datetime import datetime, timezone
          articles = json.load(open("data/articles.json"))
          output = {"updatedAt": datetime.now(timezone.utc).isoformat(), "articles": articles}
          json.dump(output, open("frontend/articles.json", "w"), indent=2)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/articles.json
          git diff --cached --quiet || git commit -m "chore: refresh articles [skip ci]"
          git push
